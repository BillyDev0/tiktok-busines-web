<title>Bro Billy | WhatsApp</title>
<style>
:root {
  --bg: #08090d;
  --panel: #11131b;
  --text: #f7f7fb;
  --muted: #a7a9b5;
  --red: #ff263f;
  --border: rgba(255,255,255,.78);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 42px 18px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(ellipse at 50% 8%, rgba(255,38,63,.19), transparent 38%),
    radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.10), transparent 40%),
    var(--bg);
}
.wrap { width: min(100%, 460px); }
.card {
  position: relative; overflow: hidden; padding: 30px 24px 26px;
  text-align: center; border: 1.5px solid var(--border);
  border-radius: 28px; background: linear-gradient(160deg, rgba(25,27,37,.98), rgba(10,11,16,.98));
  box-shadow: 0 0 0 5px rgba(255,255,255,.045), 0 22px 70px rgba(0,0,0,.65), 0 0 34px rgba(255,38,63,.12);
}
.card::before {
  content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255,38,63,.10); filter: blur(55px); top: -130px; left: calc(50% - 110px);
  pointer-events: none;
}
.profile {
  position: relative; width: 142px; height: 142px; object-fit: cover;
  border-radius: 50%; border: 3px solid #fff; padding: 4px;
  background: #171820; box-shadow: 0 0 0 5px rgba(255,38,63,.35), 0 8px 28px rgba(0,0,0,.5);
}
h1 { position: relative; margin: 25px 0 8px; font-size: 34px; letter-spacing: 1.2px; }
h1 span { color: var(--red); }
.desc { position: relative; color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 auto 28px; max-width: 310px; }
.links { display: grid; gap: 15px; }
.link {
  display: flex; align-items: center; gap: 14px; min-height: 86px;
  padding: 15px 17px; border: 1px solid rgba(255,255,255,.83);
  border-radius: 17px; text-align: left; text-decoration: none; color: var(--text);
  background: linear-gradient(120deg, #20222c, #12141c);
  box-shadow: 0 7px 20px rgba(0,0,0,.28);
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.link:hover { transform: translateY(-3px); border-color: var(--red); box-shadow: 0 9px 26px rgba(255,38,63,.14); }
.icon {
  flex: 0 0 48px; width: 48px; height: 48px; display: grid; place-items: center;
  border-radius: 13px; color: white; background: var(--red);
}
.icon svg { width: 27px; height: 27px; }
.copy { flex: 1; min-width: 0; }
.label { display: block; font-weight: 800; font-size: 15px; letter-spacing: .3px; }
.detail { display: block; margin-top: 5px; color: #b9bbc5; font-size: 13px; overflow-wrap: anywhere; }
.chevron { color: #d5d6dc; font-size: 25px; }
.note { margin-top: 24px; color: #777b88; font-size: 11px; letter-spacing: 1.4px; }
@media (max-width: 380px) {
  .card { padding: 26px 17px 22px; }
  h1 { font-size: 30px; }
  .link { padding: 13px; gap: 11px; }
}
</style>
</head>
